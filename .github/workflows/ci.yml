# LionPhotos — continuous integration (the same pipeline as LionOrganizer's).
# Runs on pushes to main and on pull requests, and is reused by release.yml before anything is published.
# Kept light on purpose:
#  - changes that only touch documentation do not run it;
#  - a newer push to the same branch cancels the run still going for the older one;
#  - a push to main whose commit is already tagged vX.Y.Z (git push origin main vX.Y.Z) skips the tests here,
#    because the Release workflow runs exactly the same jobs for that commit;
#  - every job has a time limit, so nothing can hang for hours.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitattributes']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitattributes']
  workflow_call:

permissions:
  contents: read

concurrency:
  # inside release.yml the ref is the tag, so this never waits on the release itself
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  gate:
    name: Already being released?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      tagged: ${{ steps.check.outputs.tagged }}
    steps:
      - id: check
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          sleep 20 # the tag usually arrives in the same push; give it a moment
          if git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/v*' | grep -q "^$SHA"; then
            echo "Commit $SHA has a version tag: the Release workflow tests it, nothing to do here."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint install.sh
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh
        run: shellcheck -s bash -S warning scripts/install.sh

  # The content model (TinyCLIP, what the photos show) is not in git: it is built here from its published
  # weights (tools/models/build.py, pinned revision) once per change of the script or of the categories, kept
  # in the cache, and handed to the jobs that test the app or build its installers.
  models:
    name: Content model (TinyCLIP)
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: models/tinyclip
          key: tinyclip-${{ hashFiles('tools/models/build.py', 'tools/models/requirements.txt', 'src/workbench/contrib/albums/contentCategories.js') }}
      - name: Build the model
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          python3 -m pip install --quiet --break-system-packages "torch==$(grep -oP '^torch==\K.*' tools/models/requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --break-system-packages -r <(grep -v '^torch==' tools/models/requirements.txt)
          python3 tools/models/build.py --only tinyclip
      - name: The model is complete
        run: |
          test -s models/tinyclip/vision.onnx && test -s models/tinyclip/categories.bin && test -s models/tinyclip/manifest.json
          ls -la models/tinyclip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-model
          path: models/tinyclip
          if-no-files-found: error
          retention-days: 3

  test:
    name: Tests
    needs: [gate, models]
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-model
          path: models/tinyclip
      - name: Allow Chromium's sandbox on Ubuntu 24.04 runners
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # xvfb comes with the runner image; install it only if missing, never waiting on apt for long
          if ! command -v xvfb-run >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -E timeout 120 apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 </dev/null
            sudo -E timeout 180 apt-get install -y -qq --no-install-recommends xvfb </dev/null >/dev/null
          fi
          xvfb-run --help >/dev/null
      - name: Translations (ten languages, every message, same placeholders)
        run: python3 tools/nls/build.py && npm run test:i18n
      - name: Face and pet recognition logic
        run: npm run test:faces
      - name: Open with
        run: npm run test:openwith
      - name: Plugins
        run: npm run test:plugins
      - name: Similar photos and raw + JPEG twins
        run: npm run test:similar
      - name: What the photos show (content categories)
        run: npm run test:content
      - name: Where a folder is (disk, external, cloud, network)
        run: npm run test:source
      - name: End-to-end (a generated collection of photos, RAW files and videos)
        timeout-minutes: 12
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          command -v ffmpeg >/dev/null || { sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg </dev/null >/dev/null; }
          python3 tools/make-fixtures.py "$RUNNER_TEMP/e2e/Fotos"
          LIONPHOTOS_FOLDER="$RUNNER_TEMP/e2e/Fotos" xvfb-run -a npx electron tools/e2e.js
      - name: Release assets are reproducible
        run: |
          node tools/make-release.js --out "$RUNNER_TEMP/r1"
          node tools/make-release.js --out "$RUNNER_TEMP/r2"
          diff "$RUNNER_TEMP/r1/SHA256SUMS" "$RUNNER_TEMP/r2/SHA256SUMS"
      - name: Installer end to end (local release, per-user install)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/srv/releases/latest/download" "$RUNNER_TEMP/srv/releases/download/v$v"
          cp "$RUNNER_TEMP"/r1/* "$RUNNER_TEMP/srv/releases/latest/download/"
          cp "$RUNNER_TEMP"/r1/* "$RUNNER_TEMP/srv/releases/download/v$v/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/srv" >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          export LIONPHOTOS_ALLOW_INSECURE_FOR_TESTS=1 LIONPHOTOS_RELEASES_URL=http://127.0.0.1:8765/releases
          bash scripts/install.sh --user --yes --no-deps
          test -x "$HOME/.local/share/lionphotos/lionphotos"
          test -f "$HOME/.local/share/lionphotos/resources/app/package.json"
          test -f "$HOME/.local/share/applications/lionphotos.desktop"
          app="$HOME/.local/share/lionphotos/lionphotos"
          xvfb-run -a "$HOME/.local/bin/lionphotos" --disable-gpu >/dev/null 2>&1 &
          sleep 10
          pgrep -f "$app" >/dev/null || { echo "the installed app did not start"; exit 1; }
          pkill -f "$app" || true
          sleep 2
          printf 'x' >> "$RUNNER_TEMP/srv/releases/download/v$v/lionphotos-$v.tar.gz"
          if bash scripts/install.sh --user --yes --no-deps --force; then echo "tampered bundle was accepted"; exit 1; fi
          bash scripts/install.sh --uninstall --purge --yes
          test ! -e "$HOME/.local/share/lionphotos"

  windows:
    name: Windows setup (the whole app inside) and portable .zip
    needs: [gate, models]
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-model
          path: models/tinyclip

      # The setup holds the whole app (electron-builder + NSIS): nothing is downloaded while it installs. One
      # setup per processor; the file names have no version, so ".../releases/latest/download/LionPhotos-Setup.exe"
      # is always the newest.
      - name: Build the setups and the portable versions (x64, ARM)
        shell: pwsh
        run: |
          npx --yes electron-builder@26.18.0 --win nsis zip --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npx --yes electron-builder@26.18.0 --win nsis zip --arm64 --publish never
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist\LionPhotos-Setup-x64.exe dist\LionPhotos-Setup.exe
          Get-Item dist\LionPhotos-Setup.exe, dist\LionPhotos-Setup-arm64.exe, dist\LionPhotos-win-x64.zip, dist\LionPhotos-win-arm64.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: |
            dist/LionPhotos-Setup.exe
            dist/LionPhotos-Setup-arm64.exe
            dist/LionPhotos-win-x64.zip
            dist/LionPhotos-win-arm64.zip
          if-no-files-found: error

      - name: The setup end to end (install, start, update over it, earlier setup replaced, uninstall)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $v = node -p "require('./package.json').version"
          $setup = (Resolve-Path dist\LionPhotos-Setup.exe).Path
          $app = Join-Path $env:LOCALAPPDATA 'Programs\LionPhotos'
          $data = Join-Path $env:APPDATA 'LionPhotos'
          $innoKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{10F3A9B6-64DA-4D56-BE79-9E2BE938402D}_is1'
          function Assert-True($ok, [string] $msg) { if (-not $ok) { throw "FAILED: $msg" }; Write-Host "OK   $msg" }
          function Get-AppProcess { @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith("$app\", [StringComparison]::OrdinalIgnoreCase) }) }
          function Test-AppStarts {
            $p = Start-Process (Join-Path $app 'LionPhotos.exe') -PassThru
            Start-Sleep -Seconds 12
            $alive = -not $p.HasExited
            Get-AppProcess | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            return $alive
          }
          function Wait-Gone([string] $path) { for ($i = 0; $i -lt 120 -and (Test-Path $path); $i++) { Start-Sleep -Seconds 1 }; -not (Test-Path $path) }
          function Get-AppEntry { Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'LionPhotos' } | Select-Object -First 1 }
          function Invoke-Setup([string[]] $arguments) { (Start-Process $setup -ArgumentList $arguments -Wait -PassThru).ExitCode }

          # 0. a LionPhotos installed by the earlier setup (Inno Setup, up to 1.53), when the latest published
          #    release still has it: the new setup must replace it, keeping the settings and the catalog
          $earlier = Join-Path $env:RUNNER_TEMP 'earlier-setup.exe'
          try { Invoke-WebRequest -UseBasicParsing "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/LionPhotos-Setup.exe" -OutFile $earlier } catch { Write-Host "no earlier setup to try: $_" }
          if (Test-Path $earlier) {
            Start-Process $earlier -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait | Out-Null
            Start-Sleep -Seconds 5
          }
          $hadInno = Test-Path $innoKey
          if ($hadInno) { Write-Host 'the earlier setup (Inno) is installed: the new setup must replace it' } else { Write-Host 'the latest release is not the earlier setup: nothing to replace' }
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path (Join-Path $data 'keep.txt') -Value 'the settings and the catalog stay'

          # 1. install, quietly
          $code = Invoke-Setup @('/S')
          Assert-True ($code -eq 0) "LionPhotos-Setup.exe /S finished (exit code $code)"
          Assert-True (Test-Path "$app\LionPhotos.exe") 'installed in %LOCALAPPDATA%\Programs\LionPhotos'
          Assert-True (Test-Path "$app\resources\app.asar") 'the app is inside (app.asar), nothing was downloaded'
          Assert-True ((Get-AppEntry).DisplayVersion -eq $v) "Settings > Apps shows LionPhotos $v"
          Assert-True (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\LionPhotos.lnk") 'Start menu shortcut'
          if ($hadInno) {
            Assert-True (Wait-Gone $innoKey) 'the earlier setup was uninstalled (one LionPhotos in Settings > Apps)'
            Assert-True (-not (Test-Path "$app\unins000.exe")) "the earlier setup's files are gone"
            Assert-True (Wait-Gone "$env:LOCALAPPDATA\LionPhotos-Installer") "the earlier setup's kept copy is gone"
          }
          Assert-True (Test-Path (Join-Path $data 'keep.txt')) 'settings and catalog kept'
          Assert-True (Test-AppStarts) 'the installed app starts'

          # 2. an update, as the update window starts it: quietly over the installed one
          $code = Invoke-Setup @('--updated', '/S')
          Assert-True ($code -eq 0) "update over the installed version (exit code $code)"
          Assert-True ((Test-Path "$app\LionPhotos.exe") -and (Test-Path "$app\Uninstall LionPhotos.exe")) 'still installed after the update'
          Assert-True (@(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'LionPhotos' }).Count -eq 1) 'one entry in Settings > Apps'

          # 3. uninstall, with the app open: the uninstaller closes it, removes the app, keeps the settings and the catalog
          Start-Process (Join-Path $app 'LionPhotos.exe') | Out-Null
          Start-Sleep -Seconds 8
          Start-Process (Join-Path $app 'Uninstall LionPhotos.exe') -ArgumentList '/S' -Wait | Out-Null
          Assert-True (Wait-Gone "$app\LionPhotos.exe") 'the uninstaller closed the app and removed it'
          for ($i = 0; $i -lt 60 -and (Get-AppEntry); $i++) { Start-Sleep -Seconds 1 }
          Assert-True (-not (Get-AppEntry)) 'the entry in Settings > Apps is gone'
          Assert-True (Test-Path (Join-Path $data 'keep.txt')) 'settings and catalog kept after uninstalling'
